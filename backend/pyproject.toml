[project]
name = "paz-backend"
version = "0.1.0"
description = "PAZOS — backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "geoalchemy2>=0.20.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "orjson>=3.13.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "redis>=8.1.0",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
paz = "app.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "testcontainers[postgres,redis]>=4.15.0",
    "types-docker>=7.2.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions/*.py.mako"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PL", "N", "T20", "PT", "TID", "ERA"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S608"]
"migrations/**" = ["E501", "N999", "S608"]  # identifiers validated by migrations.helpers.app_role

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "geoalchemy2.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = ["integration: requires a real PostgreSQL/PostGIS (testcontainers)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy asyncio runs ORM code inside greenlets; without this coverage misses it.
concurrency = ["thread", "greenlet"]
omit = ["app/cli.py", "app/asgi.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

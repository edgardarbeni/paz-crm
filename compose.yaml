# PAZOS — development stack.  First run:  ./scripts/bootstrap-env.sh && docker compose up --build
# https://localhost (Caddy, local TLS)  ·  Mailpit UI: http://localhost:8025

name: paz

x-backend-env: &backend-env
  PAZ_ENVIRONMENT: development
  PAZ_LOG_LEVEL: ${PAZ_LOG_LEVEL:-INFO}
  PAZ_API_DOCS_ENABLED: "true"
  PAZ_CORS_ALLOWED_ORIGINS: https://localhost
  PAZ_DATABASE_URL: postgresql://${PAZ_DB_APP_USER:-paz_app}:${PAZ_DB_APP_PASSWORD:?Ejecuta ./scripts/bootstrap-env.sh}@db:5432/${PAZ_DB_NAME:-paz}
  PAZ_MIGRATIONS_DATABASE_URL: postgresql://${PAZ_DB_OWNER_USER:-paz_owner}:${PAZ_DB_OWNER_PASSWORD:?Ejecuta ./scripts/bootstrap-env.sh}@db:5432/${PAZ_DB_NAME:-paz}
  PAZ_DATABASE_APP_ROLE: ${PAZ_DB_APP_USER:-paz_app}
  PAZ_REDIS_URL: redis://redis:6379/0
  PAZ_ENCRYPTION_KEYS: ${PAZ_ENCRYPTION_KEYS:?Ejecuta ./scripts/bootstrap-env.sh}
  PAZ_ENCRYPTION_ACTIVE_KEY_VERSION: ${PAZ_ENCRYPTION_ACTIVE_KEY_VERSION:-1}
  PAZ_BLIND_INDEX_KEY: ${PAZ_BLIND_INDEX_KEY:?Ejecuta ./scripts/bootstrap-env.sh}
  PAZ_OTEL_EXPORTER_OTLP_ENDPOINT: ${PAZ_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  PAZ_PUBLIC_BASE_URL: https://localhost
  PAZ_JWT_SECRET: ${PAZ_JWT_SECRET:?Ejecuta ./scripts/bootstrap-env.sh}
  PAZ_MAIL_BACKEND: smtp
  PAZ_SMTP_HOST: mailpit
  PAZ_SMTP_PORT: "1025"
  PAZ_MAIL_FROM: PAZOS <no-reply@localhost>

services:
  db:
    build: ./infra/db
    image: paz/postgres-postgis:18
    environment:
      POSTGRES_DB: ${PAZ_DB_NAME:-paz}
      POSTGRES_USER: ${PAZ_DB_OWNER_USER:-paz_owner}
      POSTGRES_PASSWORD: ${PAZ_DB_OWNER_PASSWORD:?Ejecuta ./scripts/bootstrap-env.sh}
      PAZ_DB_APP_USER: ${PAZ_DB_APP_USER:-paz_app}
      PAZ_DB_APP_PASSWORD: ${PAZ_DB_APP_PASSWORD:?Ejecuta ./scripts/bootstrap-env.sh}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${PAZ_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${PAZ_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
      target: dev
    image: paz/api:dev
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  api:
    image: paz/api:dev
    environment: *backend-env
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    ports:
      - "127.0.0.1:${PAZ_API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      VITE_API_BASE_URL: ""
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "127.0.0.1:${PAZ_FRONTEND_HOST_PORT:-5173}:5173"

  caddy:
    image: caddy:2.11-alpine
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "${PAZ_HTTP_HOST_PORT:-80}:80"
      - "${PAZ_HTTPS_HOST_PORT:-443}:443"
    depends_on:
      - api
      - frontend

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${PAZ_MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "127.0.0.1:${PAZ_MAILPIT_SMTP_HOST_PORT:-1025}:1025"

volumes:
  db-data:
  redis-data:
  caddy-data:
